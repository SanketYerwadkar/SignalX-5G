<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">SignalX 5G</title>
  <desc id="d">SignalX app icon, light version: a woven X inside signal rings with a 5G badge</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="70%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF3FA"/>
    </radialGradient>
    <linearGradient id="gA" gradientUnits="userSpaceOnUse" x1="347" y1="365" x2="677" y2="695">
      <stop offset="0" stop-color="#1ED0EE"/>
      <stop offset="1" stop-color="#2F5BFF"/>
    </linearGradient>
    <linearGradient id="gB" gradientUnits="userSpaceOnUse" x1="347" y1="695" x2="677" y2="365">
      <stop offset="0" stop-color="#2340C8"/>
      <stop offset="0.55" stop-color="#1687D0"/>
      <stop offset="1" stop-color="#08C9D4"/>
    </linearGradient>
    <linearGradient id="gBadge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0D6"/>
      <stop offset="1" stop-color="#00B0E4"/>
    </linearGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="#fff"/>
      <line x1="347" y1="695" x2="677" y2="365" stroke="#000" stroke-width="132" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect x="8" y="8" width="1008" height="1008" rx="232" fill="url(#bg)" stroke="#D5DEEB" stroke-width="6"/>

  <!-- signal rings -->
  <circle cx="512" cy="530" r="415" fill="none" stroke="#1687D0" stroke-opacity="0.16" stroke-width="12" stroke-linecap="round" stroke-dasharray="120 97.3"/>
  <circle cx="512" cy="530" r="345" fill="none" stroke="#1687D0" stroke-opacity="0.34" stroke-width="12" stroke-linecap="round" stroke-dasharray="150 66.77"/>

  <!-- soft glow -->
  <g filter="url(#glow)" opacity="0.28" stroke-width="96" stroke-linecap="round">
    <line x1="347" y1="365" x2="677" y2="695" stroke="url(#gA)"/>
    <line x1="347" y1="695" x2="677" y2="365" stroke="url(#gB)"/>
  </g>

  <!-- woven X -->
  <g stroke-width="96" stroke-linecap="round">
    <line x1="347" y1="365" x2="677" y2="695" stroke="url(#gA)" mask="url(#cut)"/>
    <line x1="347" y1="695" x2="677" y2="365" stroke="url(#gB)"/>
  </g>

  <!-- 5G badge -->
  <circle cx="690" cy="352" r="96" fill="url(#gBadge)" stroke="#FFFFFF" stroke-width="16"/>
  <text x="690" y="385" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="94" font-weight="800" fill="#03141A">5G</text>
</svg>
