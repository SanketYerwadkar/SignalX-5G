<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Cyan Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- X Stroke Gradient 1 -->
    <linearGradient id="cyanBlue1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- X Stroke Gradient 2 -->
    <linearGradient id="cyanBlue2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <!-- 5G Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded App Icon Base -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Radio Signal Wave Arcs -->
  <path d="M 33 78 A 30 30 0 0 1 33 42" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round" />
  <path d="M 26 85 A 42 42 0 0 1 26 35" fill="none" stroke="#22d3ee" stroke-opacity="0.2" stroke-width="2.5" stroke-linecap="round" />

  <!-- 'X' Glyph with Gradients -->
  <g filter="url(#glow)">
    <line x1="44" y1="44" x2="76" y2="76" stroke="url(#cyanBlue1)" stroke-width="9.5" stroke-linecap="round" />
    <line x1="76" y1="44" x2="44" y2="76" stroke="url(#cyanBlue2)" stroke-width="9.5" stroke-linecap="round" />
  </g>

  <!-- 5G Circular Badge -->
  <g transform="translate(82, 38)">
    <circle cx="0" cy="0" r="15" fill="url(#badgeGrad)" stroke="#05070a" stroke-width="2" />
    <!-- 5G Text in Badge -->
    <text x="-0.5" y="4.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#05070a" text-anchor="middle" letter-spacing="-0.5">5G</text>
  </g>
</svg>
